
<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f2f2f2;
    font-family: Arial;
}

.card {
    display: flex;
    width: 600px;
    height: 420px;
    background: white;
}

.art {
    width: 40%;
    background: linear-gradient(to bottom, #a99ae8, #dba1e8, #f0b4df);
    position: relative;
    overflow: hidden;
}

.art::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 25%;
    background: linear-gradient(135deg, #3970ad, #244d83);
    clip-path: polygon(0 25%, 25% 0, 48% 50%, 70% 70%, 100% 90%, 100% 100%, 0 100%);
}

.form {
    width: 60%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 30px;
    box-sizing: border-box;
}

h1 {
    font-size: 28px;
}

input {
    padding: 10px;
    margin: 8px 0;
    border: none;
    border-bottom: 1px solid #ccc;
    background: #e6effd;
}

button {
    padding: 10px;
    margin-top: 15px;
    background: #8054a5;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="card">
    <div class="art"></div>
    <div class="form">
        <h1>We are NUVA</h1>
        <p>Welcome back! Log in to your account to view today's clients:</p>
        <input type="email" placeholder="user@gmail.com">
        <input type="password" placeholder="Password">
        <button>Log in</button>
    </div>
</div>
</body>
</html>
